<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f8fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엄마 냉장고">
<title>엄마 냉장고에 뭐 있어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen app — intro card, then the real 4-door fridge fills the stage and swings open; list view and bottom sheets sit on top. */
:root{
  --bg:#f4f8fd;          /* 아주 살짝 파란 기가 도는 흰색 */
  --ink:#1c2738;
  --muted:#66758a;
  --line:#d8e2ef;
  --blue:#1d5ad6;
  --blue-soft:#e3ecfb;
  --card:#ffffff;
  --door:#28211f;        /* 오브제 다크 브라운 */
  --door-hi:#3b3230;
  --liner:#fbfcfd;
  --liner-2:#eef1f4;
  --steel:#bfc6cf;
  --steel-hi:#e4e8ec;
  --glass:rgba(160,185,205,.18);
  --bad:#d43d2c;
  --warn:#e5850b;
  --ok:#2c9a67;
  --none:#9aa6b5;
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Gaegu","Jua","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .55s ease,transform .55s ease;cursor:pointer}
#intro h1{margin:0;font-family:var(--f-display);font-weight:400;color:var(--blue);font-size:clamp(34px,10vw,64px);letter-spacing:-.01em;text-align:center;text-wrap:balance;line-height:1.15;
  animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
#intro p{margin:0;font-family:var(--f-hand);font-size:clamp(20px,5.4vw,28px);color:var(--muted);min-height:1.4em}
#intro p .caret{display:inline-block;width:2px;height:1em;background:var(--muted);vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
#intro.out{opacity:0;transform:translateY(-14px);pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:0}}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px 6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .brand{font-family:var(--f-display);color:var(--blue);font-size:20px;margin-right:auto;white-space:nowrap}
.seg{display:inline-flex;background:var(--blue-soft);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(29,90,214,.18)}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:0 6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:13px;color:var(--muted)}
.bar2 .stat b{color:var(--ink);font-weight:600}
.bar2 .stat .bad{color:var(--bad)} .bar2 .stat .warn{color:var(--warn)}
main{flex:1;min-height:0;position:relative}

/* ---------- fridge stage ---------- */
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding-bottom:76px}
#fridge{--cw:240px;--dw:72px;position:relative;display:flex;flex-direction:column;gap:5px;height:560px;
  transform:scale(.46);opacity:0;transition:transform .95s cubic-bezier(.22,.9,.25,1),opacity .4s ease;font-size:clamp(9px,calc(var(--cw)*.046),13px)}
#fridge.shown{opacity:1}
#fridge.zoom{transform:none}
.section{position:relative;display:grid;grid-template-columns:var(--dwl,var(--dw)) var(--cw) var(--dw);grid-template-rows:minmax(0,1fr);min-height:0;perspective:1500px}
.section>.cabinet,.section>.door-in{grid-row:1}
.cabinet{grid-column:2;position:relative;display:flex;flex-direction:column;background:linear-gradient(180deg,var(--liner),var(--liner-2));
  border:5px solid var(--door);border-radius:6px;box-shadow:inset 0 0 18px rgba(40,60,80,.12);overflow:hidden;min-height:0}
.panel{flex:none;background:#151313;color:#e9ecef;display:flex;justify-content:center;gap:14px;align-items:center;font-size:.82em;padding:.35em 0;letter-spacing:.04em;font-variant-numeric:tabular-nums}
.panel b{font-weight:500;font-size:1.25em}
.rows{flex:1;display:flex;flex-direction:column;padding:4% 4% 3%;gap:3%;min-height:0}
.row{display:flex;gap:4%;min-height:0}
.row.split{gap:0}
.row.split>.zone:first-child{margin-right:3px}
.row.split>.zone:last-child{margin-left:3px}
.split-bar{width:6px;flex:none;background:var(--door);border-radius:2px;margin-block:-8%}

/* zones */
.zone{position:relative;flex:1;min-width:0;border:0;background:transparent;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;border-radius:4px;transition:background .2s}
.zone:hover{background:rgba(29,90,214,.06)}
.zone .chips{display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px;padding:2px;overflow:hidden;flex:1;min-height:0;position:relative;z-index:1}
.zone .zl{position:absolute;left:3px;bottom:3px;font-size:.78em;color:#8b97a6;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92%}
.zone .cnt{position:absolute;right:2px;top:2px;z-index:2;min-width:1.5em;height:1.5em;padding:0 .35em;border-radius:999px;background:var(--blue);color:#fff;font-size:.8em;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.zone .cnt:empty{display:none}
.zone.flash{animation:flash 1.2s ease}
@keyframes flash{0%,100%{background:transparent}25%{background:rgba(29,90,214,.25)}}
.chip{max-width:100%;font-size:.86em;line-height:1.25;padding:.12em .4em .12em .35em;border-radius:3px;background:#fff;border-left:3px solid var(--none);box-shadow:0 1px 2px rgba(0,0,0,.12);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.s-bad{border-left-color:var(--bad);background:#fff1ef}
.chip.s-warn{border-left-color:var(--warn);background:#fff7ea}
.chip.s-ok{border-left-color:var(--ok)}
.chip.new{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}

.z-shelf{border-bottom:4px solid var(--steel);box-shadow:0 3px 0 -1px var(--glass);border-radius:4px 4px 1px 1px}
.z-egg,.z-veg,.z-multi,.z-fz,.z-kim,.z-drawer{background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(205,216,226,.38));border:1px solid rgba(150,165,180,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.z-veg .zl,.z-multi .zl,.z-drawer .zl{left:0;right:0;bottom:auto;top:50%;transform:translateY(-50%);text-align:center;max-width:none;font-weight:600;color:rgba(70,80,92,.55);font-size:.9em}
.z-veg{border-top:5px solid var(--steel)}
.z-multi{border-radius:6px 6px 10px 10px;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(225,232,238,.6))}
.z-fz{border-top:5px solid #cfc7bd;border-radius:2px 2px 6px 6px}
.water{flex:.42;border:1px solid rgba(150,165,180,.45);border-top:5px solid var(--steel);border-radius:4px;background:rgba(205,216,226,.3);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2;color:rgba(70,80,92,.5);font-size:.74em;font-weight:600;padding:0 2px}
.z-kim{border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(220,228,236,.55))}
.z-kim::before{content:"";position:absolute;left:8%;right:8%;top:0;height:5px;border-radius:0 0 4px 4px;background:rgba(90,140,90,.35)}

/* doors */
.door-in{position:relative;display:flex;flex-direction:column;gap:7%;padding:16% 9% 10%;background:linear-gradient(180deg,#fbfaf6,#efeee8);border:4px solid var(--door);border-radius:8px;
  box-shadow:inset 0 0 0 3px #e9e6dc;transition:transform .62s cubic-bezier(.12,.55,.3,1) .42s;min-height:0}
.door-in.l{grid-column:1;transform-origin:right center;transform:rotateY(90deg)}
.door-in.r{grid-column:3;transform-origin:left center;transform:rotateY(-90deg)}
.open .door-in.l{transform:rotateY(16deg)}
.open .door-in.r{transform:rotateY(-16deg)}
.z-bin{border-bottom:0}
.z-bin::after{content:"";position:absolute;left:-4%;right:-4%;bottom:0;height:46%;border:1px solid rgba(150,165,180,.55);border-top:2px solid rgba(255,255,255,.9);border-radius:2px 2px 6px 6px;
  background:linear-gradient(180deg,rgba(230,238,245,.55),rgba(200,212,224,.6));pointer-events:none;z-index:2}
.z-bin .zl{z-index:3;bottom:2px;left:2px}
.z-bin .chips{z-index:3}
.z-bin .cnt{z-index:4}
.door-front{position:absolute;top:0;bottom:0;width:calc(var(--cw)/2);z-index:5;border-radius:6px;
  background:linear-gradient(100deg,var(--door) 0%,var(--door-hi) 45%,var(--door) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 6px 18px rgba(30,20,15,.25);
  transition:transform .42s cubic-bezier(.55,0,.9,.55);backface-visibility:hidden}
.door-front.l{left:var(--dwl,var(--dw));transform-origin:left center}
.door-front.r{left:calc(var(--dwl,var(--dw)) + var(--cw)/2);transform-origin:right center}
.door-front.single{left:var(--dwl,var(--dw));width:var(--cw);transform-origin:right center}
.door-front.l::after,.door-front.r::after{content:"";position:absolute;top:8%;bottom:8%;width:3px;border-radius:2px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.14),transparent)}
.door-front.l::after{right:5px}.door-front.r::after{left:5px}
.open .door-front.l{transform:rotateY(-90deg)}
.open .door-front.r,.open .door-front.single{transform:rotateY(90deg)}
.drawer-front{position:absolute;left:var(--dwl,var(--dw));width:var(--cw);bottom:0;height:100%;z-index:5;border-radius:6px;
  background:linear-gradient(100deg,var(--door) 0%,var(--door-hi) 45%,var(--door) 100%);transition:height .7s cubic-bezier(.3,.7,.2,1) .25s;box-shadow:0 6px 18px rgba(30,20,15,.25)}
.drawer-front::after{content:"";position:absolute;left:30%;right:30%;top:10px;height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.open .drawer-front{height:max(26%,30px)}
/* 김치냉장고: 베이지 그레이 몸체, 서랍 위 검은 손잡이 홈 */
#fridge.k-greige{--door:#cbc7c0;--door-hi:#dcd8d1}
.k-greige .door-front,.k-greige .drawer-front{box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 6px 18px rgba(60,50,40,.18)}
.k-greige .door-front.single::after{display:none}
.k-greige .drawer-front::after{left:0;right:0;top:0;height:6px;border-radius:6px 6px 0 0;background:#2b2523}
.k-greige .door-in{box-shadow:inset 0 0 0 3px #eceae6;background:linear-gradient(180deg,#fdfdfc,#f1f1ef)}

/* ---------- FAB ---------- */
.fab{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:8;border:0;background:var(--blue);color:#fff;
  font-weight:600;font-size:16px;padding:14px 22px;border-radius:999px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 22px rgba(29,90,214,.35);white-space:nowrap}
.fab svg{width:20px;height:20px}
.fab[hidden]{display:none}

/* ---------- list ---------- */
#list{position:absolute;inset:0;overflow:auto;padding-bottom:96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.list-inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.search{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font:inherit}
.rows-list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.item:first-child{border-top:0}
.item:hover{background:#f8fafd}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:20px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .wh{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item>div{min-width:0}
.dd{font-size:12.5px;font-weight:600;padding:4px 8px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:center}
.dd small{display:block;font-weight:400;font-size:11px;opacity:.85}
.dd.s-bad{background:#fde7e4;color:var(--bad)}
.dd.s-warn{background:#fff0d9;color:#b8650a}
.dd.s-ok{background:#e2f4ea;color:#1f7a50}
.dd.s-none{background:#eef1f5;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 16px;line-height:1.6}
.empty b{display:block;font-family:var(--f-display);font-weight:400;color:var(--blue);font-size:20px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);background:var(--blue-soft);border-radius:10px;padding:10px 12px;line-height:1.5;display:flex;gap:10px;align-items:flex-start}
.note button{border:0;background:transparent;color:var(--blue);font-weight:600;padding:0;white-space:nowrap}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;z-index:20;background:rgba(20,30,45,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(20,30,45,.18);
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet.on{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--ink)}
.x{border:0;background:var(--blue-soft);color:var(--blue);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:none}
.big-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:1px solid var(--line);background:#f9fbfe;border-radius:14px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600}
.big svg{width:30px;height:30px;color:var(--blue)}
.big.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.big.primary svg{color:#fff}
.link{border:0;background:transparent;color:var(--blue);font-weight:500;padding:6px;align-self:center}
.preview{display:flex;gap:12px;align-items:center;background:#f6f9fd;border-radius:12px;padding:10px}
.preview img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.preview .st{font-size:14px;color:var(--muted);line-height:1.5;min-width:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--blue-soft);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.card .rm{position:absolute;right:8px;top:8px;border:0;background:transparent;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;box-sizing:border-box;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:14px;font-weight:600;font-size:16px;background:var(--blue);color:#fff}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.danger{background:#fde7e4;color:var(--bad)}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.foot{position:sticky;bottom:0;z-index:2;background:var(--card);padding-top:10px;box-shadow:0 -10px 12px -10px rgba(20,30,45,.18)}
.foot>.btn{width:100%}
.hbtn{border:0;background:var(--blue);color:#fff;font-weight:600;font-size:15px;border-radius:999px;padding:8px 16px;margin-left:auto;white-space:nowrap}
.hbtn:disabled{opacity:.5}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:46px;max-width:100%;text-align:left}
.field input[type=date]::-webkit-date-and-time-value{text-align:left}
.err{color:var(--bad);font-size:13px}

/* photo viewer */
.preview.tap{border:0;width:100%;text-align:left;font:inherit;color:inherit}
#viewer{position:fixed;inset:0;z-index:40;background:rgba(10,15,25,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#viewer img{max-width:100%;max-height:calc(100% - 48px);object-fit:contain;border-radius:10px}
#viewer .cap{color:#fff;font-family:var(--f-display);font-size:20px}
#viewer .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));background:rgba(255,255,255,.15);color:#fff}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:25;background:#1c2738;color:#fff;border-radius:12px;padding:10px 14px;
  font-size:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);box-sizing:border-box}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:0;background:transparent;color:#9cc0ff;font-weight:600;padding:0;white-space:nowrap}

@media (max-width:420px){header .brand{font-size:18px;width:100%}.seg button{padding:6px 10px;font-size:13px}}
@media (prefers-reduced-motion:reduce){
  #fridge,.door-front,.door-in,.drawer-front,#intro,#sheet{transition:none!important}
  #intro h1,.chip.new{animation:none}
}
</style>
</head>
<body>

<div id="intro" role="button" tabindex="0" aria-label="눌러서 냉장고 열기">
  <h1>엄마 냉장고에 뭐 있어</h1>
  <p id="sub"><span id="subtxt"></span><span class="caret"></span></p>
</div>

<div id="app">
  <header>
    <div class="brand">엄마 냉장고에 뭐 있어</div>
    <div class="seg" role="group" aria-label="냉장고 고르기">
      <button id="tab-main" aria-pressed="true">냉장고</button>
      <button id="tab-kimchi" aria-pressed="false">김치냉장고</button>
    </div>
    <div class="seg" role="group" aria-label="보기 방식">
      <button id="view-fridge" aria-pressed="true">모양</button>
      <button id="view-list" aria-pressed="false">리스트</button>
    </div>
  </header>
  <div class="bar2"><span class="stat" id="stat"></span><span id="mode"></span></div>
  <main>
    <div id="stage"><div id="fridge"></div></div>
    <div id="list" hidden></div>
    <button class="fab" id="fab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      사진 찍어서 넣기
    </button>
  </main>
</div>

<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div id="viewer" hidden role="dialog" aria-label="사진 크게 보기"><img alt=""><div class="cap"></div><button class="x" aria-label="닫기">✕</button></div>
<div id="toast" role="status"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="picIn" accept="image/*" hidden>

<script src="firebase-config.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* ============ 냉장고 구조 (엄마 냉장고 사진 기준) ============ */
const Z = {};
const zone = (id, label, full, kind, fridge, group) => (Z[id] = { id, label, full, kind, fridge, group });
// 냉장실 안쪽
zone("s1","1단 선반","냉장실 1단 선반","shelf","main","냉장실");
zone("egg","계란 서랍","냉장실 계란 서랍","egg","main","냉장실");
zone("s2","2단 선반","냉장실 2단 선반","shelf","main","냉장실");
zone("s3","3단 선반","냉장실 3단 선반","shelf","main","냉장실");
zone("s4","4단 선반","냉장실 4단 선반","shelf","main","냉장실");
zone("vegL","신선야채실","신선야채실 (왼쪽)","veg","main","냉장실");
zone("vegR","신선야채실","신선야채실 (오른쪽)","veg","main","냉장실");
zone("multiL","멀티수납코너","멀티수납코너 (왼쪽)","multi","main","냉장실");
zone("multiR","멀티수납코너","멀티수납코너 (오른쪽)","multi","main","냉장실");
// 냉장실 문
["위칸","가운데칸","아래칸"].forEach((n,i)=>{
  zone("dl"+(i+1),n,"냉장실 왼쪽 문 "+n,"bin","main","냉장실 문");
  zone("dr"+(i+1),n,"냉장실 오른쪽 문 "+n,"bin","main","냉장실 문");
});
// 냉동실
[1,2,3].forEach(i=>{
  zone("fzL"+i,"서랍 "+i,"냉동실 왼쪽 서랍 "+i+"단","fz","main","냉동실");
  zone("fzR"+i,"서랍 "+i,"냉동실 오른쪽 서랍 "+i+"단","fz","main","냉동실");
});
[1,2,3,4].forEach(i=>{
  zone("fdl"+i,i+"칸","냉동실 왼쪽 문 "+i+"칸","bin","main","냉동실 문");
  zone("fdr"+i,i+"칸","냉동실 오른쪽 문 "+i+"칸","bin","main","냉동실 문");
});
// 김치냉장고
zone("k1","1단 선반","김치냉장고 상칸 1단 선반","shelf","kimchi","김치냉장고 상칸");
zone("k2","2단 선반","김치냉장고 상칸 2단 선반","shelf","kimchi","김치냉장고 상칸");
zone("k3","3단 선반","김치냉장고 상칸 3단 선반","shelf","kimchi","김치냉장고 상칸");
zone("kdr","상칸 서랍","김치냉장고 상칸 안쪽 서랍","drawer","kimchi","김치냉장고 상칸");
zone("kmid","중칸 서랍","김치냉장고 중칸 서랍","drawer","kimchi","김치냉장고 서랍");
zone("kbot","하칸 서랍","김치냉장고 하칸 서랍","drawer","kimchi","김치냉장고 서랍");

const FRIDGES = {
  main: {
    name: "냉장고", aspect: .6, minAspect: .36, doorRatio: .3,
    sections: [
      { flex: 58, panel: [["냉동","-18°"],["냉장","2°"]],
        rows: [
          { h: 1.1, cells: ["s1"] },
          { h: .9,  cells: ["egg","s2"] },
          { h: 1,   cells: ["s3"] },
          { h: 1.05,cells: ["s4"] },
          { h: 1.25,cells: ["vegL","vegR","@water"] },
          { h: .75, cells: ["multiL","multiR"] }
        ],
        doorL: ["dl1","dl2","dl3"], doorR: ["dr1","dr2","dr3"] },
      { flex: 42,
        rows: [1,2,3].map(i => ({ h: 1, split: true, cells: ["fzL"+i,"fzR"+i] })),
        doorL: ["fdl1","fdl2","fdl3","fdl4"], doorR: ["fdr1","fdr2","fdr3","fdr4"] }
    ]
  },
  kimchi: {
    name: "김치냉장고", aspect: .6, minAspect: .4, doorRatio: .32, sides: 1, theme: "k-greige",
    sections: [
      { flex: 60, single: true,
        rows: [
          { h: 1.05, cells: ["k1"] },
          { h: 1.1,  cells: ["k2"] },
          { h: 1,    cells: ["k3"] },
          { h: .95,  cells: ["kdr"] }
        ] },
      { flex: 20, drawer: true, rows: [{ h: 1, cells: ["kmid"] }] },
      { flex: 20, drawer: true, rows: [{ h: 1, cells: ["kbot"] }] }
    ]
  }
};

/* ============ 날짜 ============ */
const DAY = 86400000;
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const parseD = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
function status(it){
  const d = parseD(it.exp); if (!d) return { cls:"s-none", txt:"날짜 없음", days:Infinity };
  const t = parseD(todayStr());
  const days = Math.round((d - t) / DAY);
  if (days < 0) return { cls:"s-bad", txt: (-days)+"일 지남", days };
  if (days === 0) return { cls:"s-bad", txt:"오늘까지", days };
  if (days <= 3) return { cls:"s-warn", txt:"D-"+days, days };
  return { cls:"s-ok", txt:"D-"+days, days };
}
const fmtExp = s => { const d = parseD(s); return d ? (d.getFullYear()%100)+"."+(d.getMonth()+1)+"."+d.getDate()+" 까지" : ""; };

/* ============ 저장 (공유 db, 없으면 이 기기에만) ============ */
const LS = "momfridge.items.v1";
const state = { items: new Map(), mode: "loading", db: null, readOnly: false, fridge: "main", view: "fridge", filter: "all", q: "", fresh: new Set() };
function lsLoad(){ try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch { return []; } }
function lsSave(){ try { localStorage.setItem(LS, JSON.stringify([...state.items.values()])); } catch {} }
const newId = () => "i" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const SEEDS = [
  ["main","s1","고춧가루"],["main","egg","계란"],["main","s3","해찬들 고추장"],["main","s3","김치"],
  ["main","s4","오이지"],["main","s4","나물무침"],["main","s4","장조림"],["main","s4","감"],
  ["main","vegL","양배추"],["main","multiL","일회용 소스"],["main","dl2","상추"],["main","dl3","초고추장"],
  ["main","dl3","백설 매실청"],["main","dl3","멸치액젓"],["main","dl3","맛술"],["main","dr1","토마토소스"],
  ["main","dr2","백설 굴소스"],["main","dr2","마요네즈"],["main","dr3","서울우유"],["main","dr3","자연은 복숭아주스"],
  ["main","dr3","칠성사이다"],["main","fzL1","까르보불닭"],
  ["kimchi","k1","락앤락 반찬통"],["kimchi","k2","빵"],["kimchi","k3","떡"],["kimchi","k3","새우젓"],
  ["kimchi","k3","참깨"],["kimchi","kdr","반찬통"]
].map(([fridge, zone, name], i) => ({ id: "seed" + String(i + 1).padStart(2, "0"), fridge, zone, name, exp: "", added: 1792310000000 + i, thumb: "", sample: true }));
const loadScript = src => new Promise((ok, bad) => { const t = document.createElement("script"); t.src = src; t.onload = ok; t.onerror = bad; document.head.append(t); });
const FB = "vendor/";

async function initStore(){
  let db = null;
  if (window.claude && typeof window.claude.use === "function") {
    try { db = await window.claude.use("db"); } catch { db = null; }
  }
  if (db) {
    state.db = db; state.mode = "shared";
    db.collection("items").onSnapshot(snap => {
      const m = new Map();
      snap.docs.forEach(d => { if (d.exists) m.set(d.id, Object.assign({ id: d.id }, d.data())); });
      state.items = m; renderAll();
    }, () => { state.mode = "error"; renderAll(); });
    return;
  }
  const cfg = window.FIREBASE_CONFIG;
  if (!window.claude && cfg && cfg.projectId) {
    try {
      await loadScript(FB + "firebase-app-compat.js");
      await loadScript(FB + "firebase-firestore-compat.js");
      firebase.initializeApp(cfg);
      const fs = firebase.firestore();
      state.fs = fs; state.mode = "loading";
      let got = false;
      fs.collection("items").onSnapshot({ includeMetadataChanges: true }, snap => {
        got = true; state.mode = snap.metadata.fromCache ? "syncing" : "shared";
        const m = new Map();
        snap.forEach(d => m.set(d.id, Object.assign({ id: d.id }, d.data())));
        state.items = m; renderAll();
      }, () => {
        if (got) { state.mode = "error"; renderAll(); return; }
        // 공유 저장소에 못 붙으면 이 휴대폰에 저장하면서라도 쓸 수 있게
        state.fs = null; state.fsFailed = true; startLocal();
      });
      seedFirestore(fs);
      return;
    } catch { state.fs = null; }
  }
  startLocal();
}
function startLocal(){
  state.mode = "local"; state.items = new Map();
  let saved = null;
  try { saved = localStorage.getItem(LS); } catch {}
  (saved == null ? SEEDS : lsLoad()).forEach(it => state.items.set(it.id, it));
  if (saved == null) lsSave();
  renderAll();
}
async function seedFirestore(fs){
  try {
    const meta = fs.collection("meta").doc("seeded");
    if ((await meta.get()).exists) return;
    const b = fs.batch();
    SEEDS.forEach(it => { const { id, ...rest } = it; b.set(fs.collection("items").doc(id), rest); });
    b.set(meta, { at: Date.now() });
    await b.commit();
  } catch {}
}
function writeErr(e){
  if (e && (e.code === "invalid_argument" || e.code === "permission-denied")) { state.readOnly = true; toast("이 링크로는 볼 수만 있어요. 넣고 빼려면 편집 권한이 필요해요."); }
  else if (e && e.code === "quota_exceeded") toast("저장 공간이 꽉 찼어요. 다 먹은 걸 먼저 빼주세요.");
  else toast("저장하지 못했어요. 잠시 뒤에 다시 해주세요.");
}
async function putItem(it){
  const clean = { fridge: it.fridge, zone: it.zone, name: it.name, exp: it.exp || "", added: it.added || Date.now(), thumb: it.thumb || "", photo: it.photo || "" };
  if (it.sample) clean.sample = true;
  if (state.db) {
    try { await state.db.collection("items").doc(it.id).set(clean); return true; } catch (e) { writeErr(e); return false; }
  }
  if (state.fs) {
    try { await state.fs.collection("items").doc(it.id).set(clean); return true; } catch (e) { writeErr(e); return false; }
  }
  state.items.set(it.id, Object.assign({ id: it.id }, clean)); lsSave(); renderAll(); return true;
}
async function delItem(id){
  if (state.db) { try { await state.db.collection("items").doc(id).delete(); return true; } catch (e) { writeErr(e); return false; } }
  if (state.fs) { try { await state.fs.collection("items").doc(id).delete(); return true; } catch (e) { writeErr(e); return false; } }
  state.items.delete(id); lsSave(); renderAll(); return true;
}

/* ============ 냉장고 그리기 ============ */
const fridgeEl = $("#fridge");
const zoneEls = new Map();
function buildFridge(key){
  const cfg = FRIDGES[key];
  fridgeEl.innerHTML = ""; zoneEls.clear();
  fridgeEl.className = cfg.theme || "";
  cfg.sections.forEach(sec => {
    const s = el("div","section"); s.style.flex = sec.flex + " 1 0";
    const cab = el("div","cabinet");
    if (sec.panel) {
      const p = el("div","panel");
      sec.panel.forEach(([k,v]) => { const sp = el("span"); sp.append(k+" "); sp.append(el("b",null,v)); p.append(sp); });
      cab.append(p);
    }
    const rows = el("div","rows");
    sec.rows.forEach(r => {
      const row = el("div","row" + (r.split ? " split" : "")); row.style.flex = r.h + " 1 0";
      r.cells.forEach((c, i) => {
        if (r.split && i === 1) row.append(el("div","split-bar"));
        if (c === "@water") { { const w = el("div","water"); w.append("급수", el("br"), "물통"); row.append(w); }; return; }
        row.append(zoneBtn(c));
      });
      rows.append(row);
    });
    cab.append(rows); s.append(cab);
    if (sec.drawer) {
      s.append(el("div","drawer-front"));
    } else if (sec.single) {
      const d = el("div","door-in r"); (sec.doorR || []).forEach(id => d.append(zoneBtn(id)));
      s.append(d, el("div","door-front single"));
    } else {
      ["l","r"].forEach(side => {
        const ids = side === "l" ? sec.doorL : sec.doorR;
        const d = el("div","door-in " + side);
        ids.forEach(id => d.append(zoneBtn(id)));
        s.append(d);
        s.append(el("div","door-front " + side));
      });
    }
    fridgeEl.append(s);
  });
  layout();
}
function zoneBtn(id){
  const z = Z[id];
  const b = el("button","zone z-" + z.kind);
  b.setAttribute("aria-label", z.full);
  b.style.flex = "1 1 0";
  b.append(el("div","chips"), el("span","zl",z.label), el("span","cnt"));
  b.addEventListener("click", () => openZone(id));
  zoneEls.set(id, b);
  return b;
}
function layout(){
  const cfg = FRIDGES[state.fridge];
  const st = $("#stage");
  const W = st.clientWidth - 24, H = st.clientHeight - 76 - 16;
  if (W <= 0 || H <= 0) return;
  const sides = cfg.sides || 2;
  const k = 1 + sides * cfg.doorRatio;
  let cw = Math.min(W / k, H * cfg.aspect);
  const h = Math.min(H, cw / cfg.minAspect);
  fridgeEl.style.setProperty("--cw", cw + "px");
  fridgeEl.style.setProperty("--dw", (cw * cfg.doorRatio) + "px");
  fridgeEl.style.setProperty("--dwl", sides === 2 ? (cw * cfg.doorRatio) + "px" : "0px");
  fridgeEl.style.height = h + "px";
}
addEventListener("resize", layout);

function playOpen(fast){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  fridgeEl.classList.remove("zoom","open","shown");
  void fridgeEl.offsetWidth;
  if (reduce) { fridgeEl.classList.add("shown","zoom","open"); return; }
  requestAnimationFrame(() => {
    fridgeEl.classList.add("shown");
    setTimeout(() => fridgeEl.classList.add("zoom"), fast ? 40 : 120);
    setTimeout(() => fridgeEl.classList.add("open"), fast ? 480 : 820);
  });
}

function renderFridge(){
  zoneEls.forEach((b, id) => {
    const items = itemsIn(id);
    const chips = b.querySelector(".chips"); chips.innerHTML = "";
    items.forEach(it => {
      const c = el("span","chip " + status(it).cls, it.name);
      if (state.fresh.has(it.id)) c.classList.add("new");
      chips.append(c);
    });
    b.querySelector(".cnt").textContent = items.length ? String(items.length) : "";
    b.setAttribute("aria-label", Z[id].full + (items.length ? ", " + items.length + "개" : ", 비어 있음"));
  });
}
const sortItems = arr => arr.sort((a,b) => (status(a).days - status(b).days) || (a.name||"").localeCompare(b.name||"","ko"));
const itemsIn = zid => sortItems([...state.items.values()].filter(it => it.zone === zid));
const itemsOf = f => [...state.items.values()].filter(it => (Z[it.zone] ? Z[it.zone].fridge : "main") === f);

/* ============ 리스트 ============ */
function itemRow(it){
  const b = el("button","item");
  const th = el("div","thumb");
  if (it.thumb) { const im = new Image(); im.alt = ""; im.src = it.thumb; th.append(im); } else th.textContent = (it.name || "?").slice(0,1);
  const mid = el("div"); mid.append(el("div","nm",it.name || "(이름 없음)"));
  const z = Z[it.zone];
  mid.append(el("div","wh",(z ? z.full : "자리 모름") + (it.exp ? " · " + fmtExp(it.exp) : "")));
  const s = status(it);
  const dd = el("div","dd " + s.cls, s.txt);
  b.append(th, mid, dd);
  b.addEventListener("click", () => openEdit(it.id));
  return b;
}
function renderList(){
  const L = $("#list"); L.innerHTML = "";
  const wrap = el("div","list-inner");
  const all = itemsOf(state.fridge);
  const f = el("div","filters");
  [["all","전체"],["bad","지난 것"],["warn","3일 안에"],["none","날짜 없음"]].forEach(([k,t]) => {
    const n = k === "all" ? all.length : all.filter(it => matchF(it,k)).length;
    const b = el("button",null,t + " " + n); b.setAttribute("aria-pressed", String(state.filter === k));
    b.onclick = () => { state.filter = k; renderList(); };
    f.append(b);
  });
  const q = el("input","search"); q.id = "q"; q.type = "search"; q.placeholder = "이름으로 찾기"; q.value = state.q;
  q.oninput = () => { state.q = q.value; drawRows(); };
  const box = el("div");
  wrap.append(f, q, box);
  const hasSample = all.some(it => it.sample);
  if (hasSample) {
    const n = el("div","note");
    n.append(el("span",null,"엄마 냉장고 사진에서 보이는 것들을 미리 넣어 놨어요. 유통기한은 하나씩 눌러서 적어주세요."));
    wrap.insertBefore(n, f);
  }
  function drawRows(){
    box.innerHTML = "";
    const qq = state.q.trim();
    const arr = sortItems(all.filter(it => matchF(it, state.filter) && (!qq || (it.name||"").includes(qq))));
    if (!arr.length) {
      const e = el("div","empty");
      e.append(el("b",null, all.length ? "여기엔 없어요" : FRIDGES[state.fridge].name + "가 비어 있어요"));
      e.append(document.createTextNode(all.length ? "다른 필터를 눌러보세요." : "아래 ‘사진 찍어서 넣기’를 누르고 이름이랑 유통기한이 보이게 찍어주세요."));
      box.append(e); return;
    }
    const rl = el("div","rows-list"); arr.forEach(it => rl.append(itemRow(it))); box.append(rl);
  }
  drawRows();
  L.append(wrap);
}
function matchF(it,k){ const s = status(it).cls; return k === "all" || (k === "bad" && s === "s-bad") || (k === "warn" && s === "s-warn") || (k === "none" && s === "s-none"); }

function renderStat(){
  const all = itemsOf(state.fridge);
  const bad = all.filter(it => status(it).cls === "s-bad").length;
  const warn = all.filter(it => status(it).cls === "s-warn").length;
  const st = $("#stat"); st.innerHTML = "";
  st.append("모두 "); st.append(el("b",null,all.length+"개"));
  if (bad) { st.append(" · "); st.append(el("b","bad","지난 것 "+bad)); }
  if (warn) { st.append(" · "); st.append(el("b","warn","3일 안에 "+warn)); }

async function shrink(file, max, q){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return { blob: await new Promise(r => c.toBlob(r, "image/jpeg", q)), url: c.toDataURL("image/jpeg", q) };
}
async function squareThumb(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height), N = 112;
  const c = document.createElement("canvas"); c.width = c.height = N;
  c.getContext("2d").drawImage(bmp, (bmp.width-s)/2, (bmp.height-s)/2, s, s, 0, 0, N, N);
  return c.toDataURL("image/jpeg", .72);
}

  }

  if (res) {
    const items = (res && Array.isArray(res.items) ? res.items : []).filter(x => x && typeof x === "object").map(x => ({
      name: String(x.name || "").slice(0, 40),

    return;
  }
  let items = [];
  try { items = await ocrLocal(big, ctl.signal); } catch { items = []; }

/* Firebase AI Logic (무료 Gemini) — claude.ai 밖에서 사진 보기 */
let aiModelP = null;
function aiModel(){
  const cfg = window.FIREBASE_CONFIG;
  if (window.claude || !cfg || !cfg.projectId) return null;
  if (!aiModelP) aiModelP = loadScript("vendor/firebase-ai.js").then(() => window.FridgeAI.model(cfg, "gemini-2.5-flash"));
  return aiModelP;
}
async function geminiJson(prompt, blob){
  let m;
  try { m = await aiModel(); } catch (e) { aiModelP = null; throw e; }
  const b64 = await new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = bad; r.readAsDataURL(blob); });
  const out = await m.generateContent([prompt, { inlineData: { data: b64, mimeType: "image/jpeg" } }]);
  const t = out.response.text();
  return JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
}

/* 휴대폰 안에서 글자 읽기 (Tesseract) */
let ocrWorker = null;
async function ocrLocal(blob, signal){
  const st = $("#ocrst");
  const say = t => { if (st) { st.innerHTML = '<span class="spin"></span>'; st.append(t); } };
  if (!window.Tesseract) { say("글자 읽을 준비 중이에요. 처음 한 번은 조금 걸려요."); await loadScript("vendor/tesseract.min.js"); }
  if (signal.aborted) return [];
  if (!ocrWorker) {
    ocrWorker = await Tesseract.createWorker(["kor","eng"], 1, {
      workerPath: "vendor/worker.min.js", corePath: "vendor/", langPath: "vendor/lang",
      logger: m => { if (m.status === "recognizing text") say("글자 읽는 중 " + Math.round(m.progress * 100) + "%"); }
    });
  }
  if (signal.aborted) return [];
  // 큰 상품 이름과 작은 날짜 글씨를 둘 다 잡으려고 크기를 바꿔 세 번 읽어요
  const bmp = await createImageBitmap(blob);
  const texts = [], lines = [];
  for (const k of [1, .5, .28]) {
    if (signal.aborted) return [];
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const { data } = await ocrWorker.recognize(c);
    texts.push(data.text || "");
    (data.lines || []).forEach(l => lines.push({ text: l.text, confidence: l.confidence, h: l.bbox ? (l.bbox.y1 - l.bbox.y0) / k : 1 }));
  }
  return [parseLabel({ text: texts.join("\n"), lines })];
}
function parseLabel(data){
  const text = (data.text || "").replace(/[ \t]+/g, " ");
  const now = parseD(todayStr());
  const found = [];
  const push = (y, m, d, at) => {
    y = +y; m = +m; d = +d; if (y < 100) y += 2000;
    if (m < 1 || m > 12 || d < 1 || d > 31 || y < 2000 || y > 2100) return;
    const before = text.slice(Math.max(0, at - 14), at);
    found.push({ s: y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0"),
      key: /유통|소비|까지|EXP|exp|BB|Best/.test(before) || /^.{0,12}까지/.test(text.slice(at)), mfg: /제조|포장|생산|MFG/.test(before) });
  };
  let r;
  const R1 = /(20\d{2})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/g;
  while ((r = R1.exec(text))) push(r[1], r[2], r[3], r.index);
  const R2 = /(^|[^\d])(\d{2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})(?!\d)/g;
  while ((r = R2.exec(text))) push(r[2], r[3], r[4], r.index + r[1].length);
  const R3 = /(^|[^\d])(20\d{2})(\d{2})(\d{2})(?!\d)/g;
  while ((r = R3.exec(text))) push(r[2], r[3], r[4], r.index + r[1].length);
  const pick = found.find(f => f.key) || found.filter(f => !f.mfg).sort((a, b) => b.s.localeCompare(a.s))[0] || null;
  const SKIP = /유통|소비|제조|원재료|원료|영양|보관|kcal|함량|성분|반품|교환|용량|주소|판매|고객|소재지|품목|식품유형|내용량|알레르기|섭취|냉장|냉동|주의/;
  let best = "", bestH = 0;
  (data.lines || []).forEach(l => {
    const t = (l.text || "").replace(/[^가-힣A-Za-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
    const hangul = (t.match(/[가-힣]/g) || []).length;
    const ratio = hangul / Math.max(1, t.replace(/ /g, "").length);
    const conf = l.confidence || 0;
    if (hangul < 2 || ratio < .5 || SKIP.test(t) || conf < 50) return;
    // 크게, 또렷하게, 한글 위주로 적힌 줄을 이름으로
    const score = (l.h || 1) * ratio * conf;
    if (score > bestH) { bestH = score; best = t; }
  });
  best = best.slice(0, 24);
  return { name: best, expiry: pick ? pick.s : "", zone: pendingZone || guessZone(best) };
}

      go.disabled = true;
      let lastZone = null;
      for (const c of ready) {
        const it = { id: newId(), fridge: fk, zone: c.sel.value, name: c.name.value.trim(), exp: c.exp.value, added: Date.now(), thumb: thumb || "", photo: thumb ? pendingPhoto : "" };
        state.fresh.add(it.id);
        if (!(await putItem(it))) { go.disabled = false; return; }
        lastZone = it.zone;
      }
      closeSheet();
      if (state.view !== "fridge") setView("fridge");
      flashZone(lastZone);
      toast(ready.length > 1 ? ready.length + "개 넣었어요" : ready[0].name.value.trim() + " 넣었어요");
    };
    go.dataset.primary = "넣기";
    const foot = el("div","foot"); foot.append(go); root.append(foot);
    built = true;
  });
  setTimeout(() => { const n = $("#n0"); if (n && !n.value) n.focus(); }, 350);
}

function guessZone(name){
  const n = name || "";
  const has = (...w) => w.some(x => n.includes(x));
  if (state.fridge === "kimchi") {
    if (has("김치","깍두기","총각","동치미","젓","장아찌")) return "kmid";
    if (has("무","배추","감자","양파","당근","사과","배","과일","채소")) return "kbot";
    if (has("반찬","통")) return "kdr";
    if (has("떡","깨","가루","쌀","곡","콩")) return "k3";
    return "k2";
  }
  if (has("계란","달걀","메추리")) return "egg";
  if (has("우유","주스","사이다","콜라","물","음료","요구르트","두유")) return "dr3";
  if (has("간장","식초","액젓","참치액","청","시럽","맛술","올리고당","초고추장","케찹","케첩")) return "dl3";
  if (has("소스","마요","드레싱","굴소스","머스타드")) return "dr2";
  if (has("잼","토마토소스","병")) return "dr1";
  if (has("배추","양배추","상추","양파","감자","당근","오이","파","무","사과","배","귤","감","채소","과일","버섯")) return "vegL";
  if (has("아이스","냉동","만두","얼음","떡","돈까스","너겟","핫도그")) return "fzL1";
  if (has("고기","삼겹","목살","닭","생선","오징어","새우")) return "fzL2";
  if (has("고추장","된장","쌈장")) return "s3";
  if (has("김치","반찬","무침","장조림","나물","오이지")) return "s4";
  return "s2";
}

function flashZone(zid){
  if (!zid) return;
  const b = zoneEls.get(zid);
  if (!b) return;
  b.classList.remove("flash"); void b.offsetWidth; b.classList.add("flash");
}

/* ============ 사진 크게 보기 ============ */
function showPhoto(src, name){
  const v = $("#viewer"); v.querySelector("img").src = src; v.querySelector("img").alt = name || ""; v.querySelector(".cap").textContent = name || "";
  v.hidden = false;
}
$("#viewer").onclick = () => { $("#viewer").hidden = true; };
addEventListener("keydown", e => { if (e.key === "Escape") $("#viewer").hidden = true; });

/* ============ 토스트 ============ */
let toastT = 0;
function toast(msg, act, fn){
  $("#toastMsg").textContent = msg;
  const a = $("#toastAct");
  if (act) { a.hidden = false; a.textContent = act; a.onclick = () => { fn(); $("#toast").classList.remove("on"); }; } else a.hidden = true;
  $("#toast").classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => $("#toast").classList.remove("on"), act ? 5000 : 2600);
}

/* ============ 화면 전환 ============ */
function setFridge(key, animate){
  state.fridge = key;
  $("#tab-main").setAttribute("aria-pressed", String(key === "main"));
  $("#tab-kimchi").setAttribute("aria-pressed", String(key === "kimchi"));
  buildFridge(key); renderAll();
  if (state.view === "fridge" && animate !== false) playOpen(true);
  else fridgeEl.classList.add("shown","zoom","open");
  try { history.replaceState(null, "", key === "kimchi" ? "#kimchi" : "#fridge"); } catch {}
}
function setView(v){
  state.view = v;
  $("#view-fridge").setAttribute("aria-pressed", String(v === "fridge"));
  $("#view-list").setAttribute("aria-pressed", String(v === "list"));
  $("#stage").hidden = v !== "fridge"; $("#list").hidden = v !== "list";
  if (v === "list") renderList(); else layout();
}
$("#tab-main").onclick = () => state.fridge !== "main" && setFridge("main");
$("#tab-kimchi").onclick = () => state.fridge !== "kimchi" && setFridge("kimchi");
$("#view-fridge").onclick = () => setView("fridge");
$("#view-list").onclick = () => setView("list");
$("#fab").onclick = () => openAdd(null);

/* ============ 시작 ============ */
const startKey = location.hash === "#kimchi" ? "kimchi" : "main";
state.fridge = startKey;
$("#tab-main").setAttribute("aria-pressed", String(startKey === "main"));
$("#tab-kimchi").setAttribute("aria-pressed", String(startKey === "kimchi"));
buildFridge(startKey);
renderStat();
initStore();

const intro = $("#intro");
let introDone = false;
function endIntro(){
  if (introDone) return; introDone = true;
  intro.classList.add("out");
  setTimeout(() => { intro.hidden = true; }, 600);
  layout(); playOpen(false);
}
if (location.hash === "#kimchi" || location.hash === "#fridge") { intro.hidden = true; introDone = true; layout(); playOpen(true); }
else {
  const SUB = "-그건 말이지...";
  const out = $("#subtxt");
  let i = 0;
  setTimeout(function type(){ out.textContent = SUB.slice(0, ++i); if (i < SUB.length) setTimeout(type, 95); else setTimeout(endIntro, 1100); }, 900);
  intro.addEventListener("click", endIntro);
  intro.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") endIntro(); });
}
})();
</script>
</body>
</html>
